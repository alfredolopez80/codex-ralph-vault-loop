<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.title{font-size:27px;font-weight:700;fill:#0d0d0d}.sub{font-size:13px;fill:#6e6e80}.h{font-size:16px;font-weight:700;fill:#0d0d0d}.n{font-size:28px;font-weight:750;fill:#10a37f}.t{font-size:12px;fill:#6e6e80}.rule{font-size:14px;font-weight:650;fill:#0d0d0d}.small{font-size:11px;fill:#6e6e80}
</style>
<rect width="1200" height="760" fill="#fff"/>
<text x="600" y="42" text-anchor="middle" class="title">Ralph Convergence Budget</text>
<text x="600" y="66" text-anchor="middle" class="sub">Finite budgets turn engineering iteration into a convergent process</text>
<rect x="70" y="100" width="1060" height="84" rx="12" fill="#f7f7f8" stroke="#e5e5e5"/>
<text x="600" y="132" text-anchor="middle" class="rule">Cada nueva evidencia debe acercar monotónicamente la tarea hacia CLOSED o hacia una decisión explícita del usuario.</text>
<text x="600" y="157" text-anchor="middle" class="small">Ninguna fase puede reiniciar indefinidamente una fase anterior.</text>
<g>
<rect x="75" y="230" width="220" height="130" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><text x="185" y="267" text-anchor="middle" class="h">Full Aristotle</text><text x="185" y="315" text-anchor="middle" class="n">1</text><text x="185" y="340" text-anchor="middle" class="t">per task epoch</text>
<rect x="315" y="230" width="220" height="130" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><text x="425" y="267" text-anchor="middle" class="h">Material Amendment</text><text x="425" y="315" text-anchor="middle" class="n">1</text><text x="425" y="340" text-anchor="middle" class="t">then USER_DECISION</text>
<rect x="555" y="230" width="220" height="130" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><text x="665" y="267" text-anchor="middle" class="h">Automatic Subagents</text><text x="665" y="315" text-anchor="middle" class="n">0</text><text x="665" y="340" text-anchor="middle" class="t">max active child = 1</text>
<rect x="795" y="230" width="220" height="130" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><text x="905" y="267" text-anchor="middle" class="h">Material Review</text><text x="905" y="315" text-anchor="middle" class="n">≤1</text><text x="905" y="340" text-anchor="middle" class="t">second automatic = 0</text>
<rect x="195" y="405" width="250" height="130" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><text x="320" y="442" text-anchor="middle" class="h">Repair Cycles</text><text x="320" y="490" text-anchor="middle" class="n">≤3</text><text x="320" y="515" text-anchor="middle" class="t">1 per failure fingerprint</text>
<rect x="475" y="405" width="250" height="130" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><text x="600" y="442" text-anchor="middle" class="h">Generative Final Audit</text><text x="600" y="490" text-anchor="middle" class="n">0</text><text x="600" y="515" text-anchor="middle" class="t">default; critical needs approval</text>
<rect x="755" y="405" width="250" height="130" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><text x="880" y="442" text-anchor="middle" class="h">Stop Continuations</text><text x="880" y="490" text-anchor="middle" class="n">1 + 1</text><text x="880" y="515" text-anchor="middle" class="t">ordinary + distinct critical</text>
</g>
<path d="M600 575 L600 625" stroke="#10a37f" stroke-width="2"/>
<polygon points="594,620 606,620 600,632" fill="#10a37f"/>
<rect x="360" y="635" width="480" height="70" rx="12" fill="#fff" stroke="#10a37f" stroke-width="1.8"/>
<text x="600" y="666" text-anchor="middle" class="h">Budget exhausted?</text>
<text x="600" y="690" text-anchor="middle" class="t">CLOSED · BLOCKED · USER_DECISION — never restart the loop</text>
</svg>
