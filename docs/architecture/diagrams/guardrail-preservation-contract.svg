<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.title{font-size:27px;font-weight:700;fill:#0d0d0d}.sub{font-size:13px;fill:#6e6e80}.h{font-size:15px;font-weight:700;fill:#0d0d0d}.t{font-size:12px;fill:#6e6e80}.rule{font-size:14px;font-weight:650;fill:#0d0d0d}</style>
<rect width="1200" height="680" fill="#fff"/>
<text x="600" y="42" text-anchor="middle" class="title">Guardrail Preservation Contract v4</text>
<text x="600" y="66" text-anchor="middle" class="sub">Efficiency removes redundant work — never the controls that keep Ralph safe and convergent</text>
<rect x="75" y="102" width="1050" height="70" rx="12" fill="#f7f7f8" stroke="#e5e5e5"/><text x="600" y="132" text-anchor="middle" class="rule">Every preserved guardrail remains authoritative in its domain.</text><text x="600" y="154" text-anchor="middle" class="t">Fast paths may skip only semantic no-ops, never permissions, safety, identity or completion evidence.</text>
<g>
<rect x="75" y="220" width="240" height="120" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><circle cx="100" cy="246" r="6" fill="#10a37f"/><text x="120" y="251" class="h">Aristotle</text><text x="100" y="280" class="t">Task-boundary reasoning.</text><text x="100" y="302" class="t">Tiered, versioned, bounded.</text>
<rect x="335" y="220" width="240" height="120" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><circle cx="360" cy="246" r="6" fill="#10a37f"/><text x="380" y="251" class="h">Anti-Rationalization</text><text x="360" y="280" class="t">Evidence gate at phase exit</text><text x="360" y="302" class="t">and Stop; no model spawn.</text>
<rect x="595" y="220" width="240" height="120" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><circle cx="620" cy="246" r="6" fill="#f97316"/><text x="640" y="251" class="h">Repo Boundary</text><text x="620" y="280" class="t">Path, worktree, ownership.</text><text x="620" y="302" class="t">Always-on for mutations.</text>
<rect x="855" y="220" width="240" height="120" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><circle cx="880" cy="246" r="6" fill="#f97316"/><text x="900" y="251" class="h">Git Safety</text><text x="880" y="280" class="t">Destructive / remote actions</text><text x="880" y="302" class="t">remain approval-gated.</text>
<rect x="205" y="390" width="240" height="120" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><circle cx="230" cy="416" r="6" fill="#f97316"/><text x="250" y="421" class="h">RED / Egress</text><text x="230" y="450" class="t">Sensitive context stays local.</text><text x="230" y="472" class="t">No advisor / vault leakage.</text>
<rect x="465" y="390" width="240" height="120" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><circle cx="490" cy="416" r="6" fill="#1d4ed8"/><text x="510" y="421" class="h">Ralph Recall</text><text x="490" y="450" class="t">Metadata-first, scoped and</text><text x="490" y="472" class="t">delta-based continuity.</text>
<rect x="725" y="390" width="240" height="120" rx="12" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/><circle cx="750" cy="416" r="6" fill="#10a37f"/><text x="770" y="421" class="h">Stop / Completion</text><text x="750" y="450" class="t">Done when + hard evidence.</text><text x="750" y="472" class="t">Finite continuation budget.</text>
</g>
<rect x="195" y="570" width="810" height="54" rx="10" fill="#fff" stroke="#10a37f" stroke-width="1.5"/><text x="600" y="602" text-anchor="middle" class="rule">Preserve controls. Optimize repetition. Enforce monotonic convergence.</text>
</svg>
