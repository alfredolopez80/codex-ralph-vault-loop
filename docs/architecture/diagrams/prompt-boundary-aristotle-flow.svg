<text x="685" y="694" text-anchor="middle" class="small">El nivel se elige por complejidad lógica, riesgo, reversibilidad e incertidumbre; la longitud solo es señal secundaria.</text>
<rect x="70" y="816" width="1260" height="40" rx="9" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="70" y="816" width="5" height="40" rx="2.5" fill="#10a37f"/>
<text x="91" y="841" class="small">Regla: cada prompt recibe orientación barata; cada tarea nueva recibe al menos Micro Aristotle; Full ocurre una vez por tarea compleja.</text>
