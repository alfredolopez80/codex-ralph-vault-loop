<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" role="img" aria-labelledby="title desc">
<title id="title">Review, Mitigation, and Final Audit</title>
<desc id="desc">Independencia de review sin recrear review → fix → review indefinido</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.title{fill:#0d0d0d;font-size:29px;font-weight:700;letter-spacing:-.02em}
.subtitle{fill:#6e6e80;font-size:14px}
.group{fill:#6e6e80;font-size:11px;font-weight:700;letter-spacing:.08em}
.node{fill:#0d0d0d;font-size:15px;font-weight:700}
.copy{fill:#6e6e80;font-size:12px}
.small{fill:#6e6e80;font-size:11px}
.tiny{fill:#6e6e80;font-size:10px}
.yes{fill:#087f63;font-size:11px;font-weight:700}
.no{fill:#9a3412;font-size:11px;font-weight:700}
</style>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0d0d0d" flood-opacity=".07"/></filter>
<marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#71717a"/></marker>
<marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10a37f"/></marker>
<marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f97316"/></marker>
<marker id="arr-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1d4ed8"/></marker>
</defs>
<rect width="1400" height="880" fill="#ffffff"/>
<text x="700.0" y="42" text-anchor="middle" class="title">Review, Mitigation, and Final Audit</text>
<text x="700.0" y="67" text-anchor="middle" class="subtitle">Independencia de review sin recrear review → fix → review indefinido</text>
<rect x="65" y="105" width="1270" height="610" rx="14" fill="#ffffff" stroke="#e5e5e5" stroke-width="1" stroke-dasharray="6 5"/>
<text x="83" y="130" class="group">BOUNDED QUALITY CLOSURE</text>
<rect x="90" y="165" width="190" height="84" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="90" y="165" width="5" height="84" rx="2.5" fill="#10a37f"/>
<text x="185.0" y="194" text-anchor="middle" class="node">Candidate verified</text>
<text x="185.0" y="215" text-anchor="middle" class="copy">focused tests green</text>
<text x="185.0" y="232" text-anchor="middle" class="copy">diff scope known</text>
<polygon points="400,151.0 502.5,207 400,263.0 297.5,207" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="400" y="204" text-anchor="middle" class="node">Risk class?</text>
<text x="400" y="224" text-anchor="middle" class="copy">low · material · critical</text>
<rect x="540" y="140" width="205" height="92" rx="10" fill="#e8f7f2" stroke="#e5e5e5" stroke-width="1.5"/>
<rect x="540" y="140" width="5" height="92" rx="2.5" fill="#10a37f"/>
<text x="642.5" y="169" text-anchor="middle" class="node">Low risk</text>
<text x="642.5" y="190" text-anchor="middle" class="copy">0 generative review</text>
<text x="642.5" y="207" text-anchor="middle" class="copy">deterministic closure</text>
<rect x="540" y="280" width="205" height="102" rx="10" fill="#eff6ff" stroke="#e5e5e5" stroke-width="1.5"/>
<rect x="540" y="280" width="5" height="102" rx="2.5" fill="#1d4ed8"/>
<text x="642.5" y="309" text-anchor="middle" class="node">Material / critical</text>
<text x="642.5" y="330" text-anchor="middle" class="copy">1 read-only review</text>
<text x="642.5" y="347" text-anchor="middle" class="copy">single review owner</text>
<rect x="840" y="280" width="190" height="102" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
<rect x="840" y="280" width="5" height="102" rx="2.5" fill="#1d4ed8"/>
<text x="935.0" y="309" text-anchor="middle" class="node">Finding triage</text>
<text x="935.0" y="330" text-anchor="middle" class="copy">accepted · rejected</text>
<text x="935.0" y="347" text-anchor="middle" class="copy">needs_info · duplicate</text>
<text x="935.0" y="364" text-anchor="middle" class="copy">pre_existing</text>
<polygon points="1170,275.0 1275.0,331 1170,387.0 1065.0,331" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
<text x="1170" y="328" text-anchor="middle" class="node">Accepted</text>
<text x="1170" y="348" text-anchor="middle" class="copy">findings?</text>
<rect x="1030" y="475" width="205" height="102" rx="10" fill="#fff7ed" stroke="#e5e5e5" stroke-width="1.5"/>
<rect x="1030" y="475" width="5" height="102" rx="2.5" fill="#f97316"/>
<text x="1132.5" y="504" text-anchor="middle" class="node">Mitigation batch 0 / 1</text>
<text x="1132.5" y="525" text-anchor="middle" class="copy">agrupada por root cause</text>
<text x="1132.5" y="542" text-anchor="middle" class="copy">un implementation owner</text>
<rect x="740" y="475" width="205" height="102" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
<rect x="740" y="475" width="5" height="102" rx="2.5" fill="#10a37f"/>
<text x="842.5" y="504" text-anchor="middle" class="node">Targeted reverify</text>
<text x="842.5" y="525" text-anchor="middle" class="copy">accepted IDs closed</text>
<text x="842.5" y="542" text-anchor="middle" class="copy">no new regression</text>
<rect x="440" y="475" width="205" height="102" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="440" y="475" width="5" height="102" rx="2.5" fill="#10a37f"/>
<text x="542.5" y="504" text-anchor="middle" class="node">Final Audit</text>
<text x="542.5" y="525" text-anchor="middle" class="copy">deterministic by default</text>
<text x="542.5" y="542" text-anchor="middle" class="copy">full gates by risk</text>
<polygon points="220,470.0 325.0,526 220,582.0 115.0,526" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
<text x="220" y="523" text-anchor="middle" class="node">Critical +</text>
<text x="220" y="543" text-anchor="middle" class="copy">preapproved?</text>
<rect x="90" y="635" width="210" height="84" rx="10" fill="#fff7ed" stroke="#e5e5e5" stroke-width="1.5"/>
<rect x="90" y="635" width="5" height="84" rx="2.5" fill="#f97316"/>
<text x="195.0" y="664" text-anchor="middle" class="node">Optional final model audit</text>
<text x="195.0" y="685" text-anchor="middle" class="copy">max 1 · terminal</text>
<text x="195.0" y="702" text-anchor="middle" class="copy">no auto mitigation loop</text>
<rect x="410" y="635" width="180" height="84" rx="10" fill="#e8f7f2" stroke="#e5e5e5" stroke-width="1.5"/>
<rect x="410" y="635" width="5" height="84" rx="2.5" fill="#10a37f"/>
<text x="500.0" y="664" text-anchor="middle" class="node">CLOSE</text>
<text x="500.0" y="685" text-anchor="middle" class="copy">evidence complete</text>
<text x="500.0" y="702" text-anchor="middle" class="copy">handoff</text>
<rect x="740" y="635" width="230" height="84" rx="10" fill="#fff7ed" stroke="#e5e5e5" stroke-width="1.5"/>
<rect x="740" y="635" width="5" height="84" rx="2.5" fill="#f97316"/>
<text x="855.0" y="664" text-anchor="middle" class="node">USER DECISION</text>
<text x="855.0" y="685" text-anchor="middle" class="copy">finding material nuevo</text>
<text x="855.0" y="702" text-anchor="middle" class="copy">budget o scope agotado</text>
<line x1="280" y1="207" x2="297" y2="207" stroke="#71717a" stroke-width="1.7" fill="none" marker-end="url(#arr)"/>
<path d="M 503 180 L 540 180" stroke="#10a37f" stroke-width="1.7" fill="none" marker-end="url(#arr-g)"/>
<text x="520" y="168" text-anchor="middle" class="yes">low</text>
<path d="M 400 263 L 400 331 L 540 331" stroke="#1d4ed8" stroke-width="1.7" fill="none" marker-end="url(#arr-b)"/>
<text x="474" y="318" text-anchor="middle" class="small">material / critical</text>
<line x1="745" y1="331" x2="840" y2="331" stroke="#1d4ed8" stroke-width="1.7" fill="none" marker-end="url(#arr-b)"/>
<line x1="1030" y1="331" x2="1065" y2="331" stroke="#71717a" stroke-width="1.7" fill="none" marker-end="url(#arr)"/>
<path d="M 1170 387 L 1170 475" stroke="#f97316" stroke-width="1.7" fill="none" marker-end="url(#arr-o)"/>
<text x="1184" y="430" class="no">sí</text>
<path d="M 1065 331 C 930 410 755 430 645 526" stroke="#10a37f" stroke-width="1.7" fill="none" marker-end="url(#arr-g)"/>
<text x="870" y="410" text-anchor="middle" class="yes">no</text>
<line x1="1030" y1="526" x2="945" y2="526" stroke="#f97316" stroke-width="1.7" fill="none" marker-end="url(#arr-o)"/>
<line x1="740" y1="526" x2="645" y2="526" stroke="#10a37f" stroke-width="1.7" fill="none" marker-end="url(#arr-g)"/>
<line x1="440" y1="526" x2="325" y2="526" stroke="#10a37f" stroke-width="1.7" fill="none" marker-end="url(#arr-g)"/>
<path d="M 642 186 C 635 360 540 400 540 475" stroke="#10a37f" stroke-width="1.7" fill="none" marker-end="url(#arr-g)"/>
<path d="M 220 582 L 220 635" stroke="#f97316" stroke-width="1.7" fill="none" marker-end="url(#arr-o)"/>
<text x="232" y="613" class="no">sí</text>
<path d="M 325 526 C 360 560 455 575 500 635" stroke="#10a37f" stroke-width="1.7" fill="none" marker-end="url(#arr-g)"/>
<text x="365" y="566" class="yes">no</text>
<line x1="300" y1="677" x2="410" y2="677" stroke="#10a37f" stroke-width="1.7" fill="none" marker-end="url(#arr-g)"/>
<path d="M 300 677 C 510 770 800 760 855 719" stroke="#f97316" stroke-width="1.7" fill="none" marker-end="url(#arr-o)" stroke-dasharray="6 5"/>
<text x="580" y="773" text-anchor="middle" class="small">hallazgo material del pase terminal → decisión humana / nueva tarea</text>
<rect x="70" y="816" width="1260" height="40" rx="9" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="70" y="816" width="5" height="40" rx="2.5" fill="#10a37f"/>
<text x="91" y="841" class="small">La auditoría final valida cierre; no reabre automáticamente review. La independencia existe, el bucle no.</text>
</svg>
