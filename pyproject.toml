[project]
name = "codex-ralph-vault-loop"
version = "0.1.0"
description = "Codex-native orchestration overlay for Ralph-style multi-agent workflows."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Reglas activas. E402 se maneja por per-file-ignores abajo (sys.path legítimo).
# E501 (line too long) se omite: el repo históricamente usa líneas largas y
# prettier/shellcheck cubren formato; forzar line-length requeriría refactor masivo.
# BLE001 (blind except) se omite: hooks y scripts operacionales deben fail-open
# por contrato (AGENTS.md: "Operational persistence hooks must fail open on
# local runtime errors"). Estrechar los excepts rompería la semántica fail-open.
# DTZ005 (datetime.now sin tz) se omite: los scripts de timestamping usan hora
# local intencionalmente para logs/stamps legibles; forzar tz cambiaría salida.
# B008 (call in default) se omite: Path.cwd() como default es patrón arraigado
# en la API de hooks de cloud-operation; freezearlo en module-level rompe tests.
# SIM102/SIM103/SIM115 se omiten: patrones idiomáticos arraigados (nested-if
# por legibilidad, NamedTemporaryFile que se pasa a subprocess).
# E702 (semicolons) se omite: estilo denso intencional en dedup hot-paths.
# F403 (import *) se omite: patrón de compatibilidad script/package en context/common.py.
# F401 (unused import) se omite: muchos módulos re-exportan funciones de
# diagnostic_json/sensitive_content para uso cruzado; el auto-fix no distingue
# imports muertos de re-exports intencionales sin __all__.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE", "EXE", "DTZ", "FURB", "FLY"]
ignore = ["E501", "BLE001", "DTZ005", "B008", "SIM102", "SIM103", "SIM115", "E702", "F403", "F401"]

[tool.ruff.lint.per-file-ignores]
# Estos módulos manipulan sys.path antes de importar módulos del repo (patrón legítimo).
"scripts/autoresearch/*.py" = ["E402"]
"scripts/context/*.py" = ["E402"]
"scripts/evals/*.py" = ["E402"]
"scripts/gates/*.py" = ["E402"]
"scripts/memory/*.py" = ["E402"]
"scripts/security/*.py" = ["E402"]
"scripts/vault/*.py" = ["E402"]
"scripts/setup/*.py" = ["E402"]
"scripts/maintenance/*.py" = ["E402"]
"scripts/model-router/*.py" = ["E402"]
"scripts/plans/*.py" = ["E402"]
"scripts/cost/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
".codex/hooks/*.py" = ["E402"]
".codex/hooks/shared/*.py" = ["E402"]
".agents/skills/*/scripts/*.py" = ["E402"]
# Este test depende del orden de imports: scripts.autoresearch.common hace sys.path
# antes de que diagnostic_json sea importable. I001 (block-level) no se puede
# silenciar con noqa por línea, y E402 no aplica (no están después de código).
"tests/evals/test_diagnostic_sanitization.py" = ["I001", "RUF100"]

